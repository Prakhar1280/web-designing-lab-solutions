<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 5: Real-Time Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="weather-card">
        <h2>Live Weather Search</h2>
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city (e.g., Delhi, London)...">
            <button id="search-btn">Search</button>
        </div>
        <div id="weather-info" class="weather-info">
            <p class="placeholder">Search for a city to display live weather metrics.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
